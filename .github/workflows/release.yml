# 发布 cmd/deepseek-harness-desktop（纯 Go 单命令，goreleaser 交叉编译）：
#   - v* tag push → 固定版本 release（vX.Y.Z，正式版，自动成为 Latest；
#     重复发布由 goreleaser replace_existing_artifacts 自动覆盖旧 asset）
# 发布全部使用现成 action（goreleaser-action），不手写 git/gh 命令。
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v4

      # v tag：goreleaser 完整发布（构建 + 打包 + 正式 release + changelog）。
      - name: goreleaser release（v tag）
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
