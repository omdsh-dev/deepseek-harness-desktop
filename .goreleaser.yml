# 发布 cmd/dsh-web-desktopify（纯 Go 单命令）到 GitHub Releases。
# 发布物是 CLI 二进制：无 cgo 依赖，CGO_ENABLED=0 可全平台交叉编译，
# 因此由 goreleaser 单 runner 构建 + 打包 + 发布。
#   - v* tag → goreleaser release（固定版本，正式 release）
version: 2

project_name: dsh-web-desktopify

# 壳源码在 pkg/shell（主模块内嵌，见 pkg/shell/embed.go），与 CLI 同源，
# 无需发布前同步内嵌副本。CLI 运行时从二进制内嵌解出壳源码并动态生成
# go.mod 后 go build，因此 CLI 二进制必须包含当前壳源码与依赖。

builds:
  - id: cli
    main: ./cmd/dsh-web-desktopify
    binary: dsh-web-desktopify
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # main 包没有 version/commit 等变量，显式覆盖默认的 -X 注入，避免链接失败。
    ldflags:
      - -s -w

archives:
  - id: cli
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: 'checksums.txt'

release:
  github:
    owner: omdsh-dev
    name: dsh-web-desktopify
  # vX.Y.Z 无预发布后缀 → 正式 release；vX.Y.Z-rc.N 自动为 pre-release。
  prerelease: auto
  # 同一 tag 重复发布时，goreleaser 自动删除同名旧 asset 后重传。
  replace_existing_artifacts: true
